name: Publish @opcify/skills index
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@opcify"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./index/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION != index/package.json version $PKG_VERSION"; exit 1
          fi
      - name: Build index
        run: node index/build.mjs
      - name: Run index tests
        run: node --test index/build.test.mjs
      - name: Publish
        run: cd index && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
